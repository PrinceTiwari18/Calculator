<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calci.css">
</head>
<body>
    <div class="container">
        <div class="box1"><input type="text"></div>
        <div class="box2">
        
            <div class="row1">
                <button class="btn" style="color: orange;">AC</button>
                <button class="btn" style="color: orange;">C</button>
                <button class="btn" style="color: orange;">%</button>
                <button class="btn" style="color: orange;">/</button>
            </div>
            <div class="row2">
                <button class="btn">7</button>
                <button class="btn">8</button>
                <button class="btn">9</button>
                <button class="btn" style="color: orange;">*</button>
            </div>
            <div class="row3">
                <button class="btn">4</button>
                <button class="btn">5</button>
                <button class="btn">6</button>
                <button class="btn" style="color: orange;">-</button>
            </div>
            <div class="row4">
                <button class="btn">1</button>
                <button class="btn">2</button>
                <button class="btn">3</button>
                <button class="btn" style="color: orange;">+</button>
            </div>
            <div class="row5">
                <button class="btn">0</button>
                <button class="btn">.</button>
                <button class="btn" id="equal" style="width:170px;">=</button>
            </div>

        </div>
    </div>        

    <script src="calci.js"></script>
</body>
</html>
